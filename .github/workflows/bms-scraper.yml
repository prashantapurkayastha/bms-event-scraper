name: Mumbai Music Event Scraper

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6:00 AM UTC (11:30 AM IST)
  workflow_dispatch:        # Manual trigger from GitHub UI
    inputs:
      debug:
        description: 'Set to 1 to email debug screenshots'
        required: false
        default: '0'

# ← This is the fix for the 403 push error
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          DEBUG: ${{ github.event.inputs.debug || '0' }}
        run: python scraper.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add known_events.json
          git diff --cached --quiet || git commit -m "chore: update event snapshot [skip ci]"
          git push
